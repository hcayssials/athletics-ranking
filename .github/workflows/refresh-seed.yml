name: Refresh ranking seed

# Keeps data/cache_seed/ (the warm snapshot baked into the Docker image) current. World
# Athletics updates rankings ~Tuesdays, so we refresh Wednesday morning. Pushing the updated
# seed to main triggers a Railway redeploy with fresh data. Also runnable on demand.
on:
  schedule:
    - cron: "0 6 * * 3"   # Wednesdays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

# Avoid overlapping runs racing on the same branch.
concurrency:
  group: refresh-seed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh the seed snapshot from World Athletics
        run: python -m scripts.refresh_seed

      - name: Commit & push if the seed changed
        run: |
          if [ -n "$(git status --porcelain data/cache_seed)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/cache_seed
            git commit -m "Weekly seed refresh ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No seed changes — nothing to commit."
          fi
